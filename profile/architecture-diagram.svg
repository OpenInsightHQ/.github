<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="osBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="understandBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#1e2d3d"/>
    </linearGradient>
    <linearGradient id="executeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#20303d"/>
    </linearGradient>

    <!-- Server rack icon -->
    <symbol id="icon-systems" viewBox="0 0 48 48">
      <rect x="8" y="6" width="32" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="13" cy="11" r="1.5" fill="#3fb950"/>
      <rect x="18" y="9" width="16" height="1.5" rx="0.5" fill="#58a6ff" opacity="0.5"/>
      <rect x="8" y="19" width="32" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="13" cy="24" r="1.5" fill="#3fb950"/>
      <rect x="18" y="22" width="16" height="1.5" rx="0.5" fill="#58a6ff" opacity="0.5"/>
      <rect x="8" y="32" width="32" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="13" cy="37" r="1.5" fill="#3fb950"/>
      <rect x="18" y="35" width="16" height="1.5" rx="0.5" fill="#58a6ff" opacity="0.5"/>
    </symbol>

    <!-- Database cylinder icon -->
    <symbol id="icon-database" viewBox="0 0 48 48">
      <ellipse cx="24" cy="10" rx="16" ry="5" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <path d="M 8 10 L 8 24 C 8 27 15 30 24 30 C 33 30 40 27 40 24 L 40 10" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <path d="M 8 24 L 8 38 C 8 41 15 44 24 44 C 33 44 40 41 40 38 L 40 24" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <ellipse cx="24" cy="24" rx="16" ry="5" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="24" cy="38" rx="16" ry="5" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>
    </symbol>

    <!-- Knowledge (books) icon -->
    <symbol id="icon-knowledge" viewBox="0 0 48 48">
      <rect x="6" y="10" width="9" height="30" rx="1.5" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <rect x="17" y="6" width="9" height="34" rx="1.5" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <rect x="28" y="14" width="9" height="26" rx="1.5" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <rect x="39" y="18" width="4" height="22" rx="1" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <line x1="19" y1="13" x2="24" y2="13" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="19" y1="18" x2="24" y2="18" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="19" y1="23" x2="24" y2="23" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="30" y1="20" x2="35" y2="20" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="30" y1="25" x2="35" y2="25" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="8" y1="16" x2="13" y2="16" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="8" y1="21" x2="13" y2="21" stroke="#58a6ff" stroke-width="1.5"/>
    </symbol>

    <!-- Brain icon -->
    <symbol id="icon-brain" viewBox="0 0 48 48">
      <path d="M 18 8 C 12 8 8 12 8 17 C 8 19 9 20 10 21 C 9 23 9 26 11 28 C 11 32 14 36 18 36 L 18 8 Z" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <path d="M 30 8 C 36 8 40 12 40 17 C 40 19 39 20 38 21 C 39 23 39 26 37 28 C 37 32 34 36 30 36 L 30 8 Z" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <path d="M 18 12 C 15 12 13 14 13 17" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
      <path d="M 18 20 C 14 20 12 23 12 26" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
      <path d="M 30 12 C 33 12 35 14 35 17" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
      <path d="M 30 20 C 34 20 36 23 36 26" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
      <line x1="18" y1="14" x2="30" y2="14" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
      <line x1="18" y1="20" x2="30" y2="20" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
      <line x1="18" y1="26" x2="30" y2="26" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
      <line x1="18" y1="32" x2="30" y2="32" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
